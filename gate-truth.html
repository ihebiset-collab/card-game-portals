<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gate of Truth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(0, 229, 255, 0.22), transparent 32%),
                radial-gradient(circle at bottom, rgba(138, 43, 226, 0.20), transparent 45%),
                #05070d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 22px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 34px 24px;
            border: 2px solid #00e5ff;
            border-radius: 24px;
            box-shadow:
                0 0 30px rgba(0, 229, 255, 0.65),
                inset 0 0 22px rgba(0, 229, 255, 0.12);
            background: rgba(0, 0, 0, 0.72);
        }

        .tag {
            color: #8ff6ff;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            color: #00e5ff;
            font-size: 44px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #c8f8ff;
            margin-bottom: 28px;
            font-size: 18px;
            line-height: 1.4;
        }

        #questionBox {
            border: 1px solid rgba(0, 229, 255, 0.55);
            border-radius: 18px;
            background: rgba(0, 229, 255, 0.07);
            padding: 25px 18px;
            margin: 25px 0;
            min-height: 185px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #question {
            font-size: 29px;
            line-height: 1.38;
            color: white;
        }

        button {
            background: #00e5ff;
            color: #05070d;
            border: none;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.45);
        }

        button:hover {
            background: #8ff6ff;
        }

        .rule {
            margin-top: 25px;
            color: #d7fbff;
            font-size: 15px;
            line-height: 1.5;
        }

        .counter {
            margin-top: 14px;
            color: #8ff6ff;
            font-size: 13px;
        }

        .back {
            display: inline-block;
            margin-top: 28px;
            color: #00e5ff;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }

            #question {
                font-size: 24px;
            }

            #questionBox {
                min-height: 210px;
            }

            button {
                font-size: 18px;
                padding: 15px 26px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="tag">Portal Card</div>
        <h1>Gate of Truth</h1>

        <div class="subtitle">
            Open the gate. Pick a player if the question asks. Answer honestly.
        </div>

        <div id="questionBox">
            <div id="question">Press the button to open the gate.</div>
        </div>

        <button onclick="openGate()">Open the Gate</button>

        <div class="counter" id="counter"></div>

        <div class="rule">
            Rule: Answer clearly. Refuse, dodge, or give a fake answer → lose 1 HP or discard 1 card.
        </div>

        <a class="back" href="index.html">Back to portals</a>
    </div>

    <script>
        const questions = [
            "Who here do you trust the least? Explain why.",
            "Who here would you never want as an enemy?",
            "Who here acts innocent but probably hides the most?",
            "Who here gives main character energy but also has villain potential?",
            "Who here do you think understands you the least?",
            "Who here do you think understands you more than you expected?",
            "Who here would you trust with a secret?",
            "Who here would you never trust with a secret?",
            "Who here seems calm but probably has the most hidden anger?",
            "Who here has the strongest presence when they enter a room?",
            "Who here is harder to read than they think?",
            "Who here probably overthinks everything but hides it well?",
            "Who here do you think gets jealous easily?",
            "Who here would survive the longest in a betrayal game?",
            "Who here would be the first to betray the group in a survival game?",
            "Who here talks big but avoids action?",
            "Who here do you think has the biggest ego?",
            "Who here has confidence that feels real, not fake?",
            "Who here tries to look unbothered but is actually sensitive?",
            "Who here do you think cares the most about what others think?",
            "Choose one player. What is one truth about them nobody says out loud?",
            "Choose one player. What do they need to hear but nobody tells them?",
            "Choose one player. What is their strongest quality?",
            "Choose one player. What is their most dangerous quality?",
            "Choose one player. What habit could make them lose respect?",
            "Choose one player. What kind of person do you think they are becoming?",
            "Choose one player. What do you think they hide behind jokes?",
            "Choose one player. What is something you respect about them but rarely say?",
            "Choose one player. What is something about them that confuses you?",
            "Choose one player. What do you think they are afraid to admit?",
            "What is one opinion you have about someone here but never said?",
            "What is one thing you pretend not to care about?",
            "What is one thing you hate admitting about yourself?",
            "What is one weakness you try to hide from people?",
            "What is one truth about yourself that people at this table might not expect?",
            "What is one compliment you secretly like receiving?",
            "What kind of attention do you secretly enjoy?",
            "What is one thing that makes you lose respect for someone quickly?",
            "What is one thing that makes you respect someone instantly?",
            "What is one red flag you ignored before and regretted?",
            "What is one thing you are too proud to ask for?",
            "What is one thing you want but are scared to say clearly?",
            "What is one emotion you hide the most?",
            "What is one part of your personality you try to control?",
            "What is one mistake that changed how you see people?",
            "What is one moment where you acted like you were fine but were not?",
            "What is one thing you wish people understood about you?",
            "What is one thing you are scared people will notice about you?",
            "What is one truth you avoid because it would force you to change?",
            "What is one promise you made to yourself but keep delaying?",
            "Who here would you pick as a leader in a crisis? Why?",
            "Who here would you not follow in a crisis? Why?",
            "Who here do you think is the most emotionally intelligent?",
            "Who here is most likely to hide pain behind humor?",
            "Who here is most likely to win an argument even when wrong?",
            "Who here would make the best rival for you?",
            "Who here would make the worst rival for you?",
            "Who here would you want on your team if everyone else became enemies?",
            "Who here would you protect first in a dangerous situation?",
            "Who here would you sacrifice first in a game if you had no choice?",
            "Who here do you think has changed the most?",
            "Who here do you think needs to change the most?",
            "Who here has the most mysterious energy?",
            "Who here is the easiest to provoke?",
            "Who here is the hardest to impress?",
            "Who here do you think secretly enjoys drama?",
            "Who here gives the safest energy?",
            "Who here gives the most unpredictable energy?",
            "Who here do you think would forgive but never forget?",
            "Who here do you think would smile while planning revenge?",
            "Who here do you think has the most pride?",
            "Who here do you think is secretly competitive?",
            "Who here would you trust to give honest advice?",
            "Who here would give good advice but not follow it themselves?",
            "Who here do you think is underestimated?",
            "Who here do you think overestimates themselves?",
            "Who here would you call first if you were in real trouble?",
            "Who here would you avoid calling if things got serious?",
            "Who here do you think has the most discipline?",
            "Who here do you think has potential but wastes it?",
            "Who here would be dangerous if they became fully focused?",
            "Who here acts the strongest but might need support the most?",
            "Who here do you think hides their ambition?",
            "Who here do you think wants to be seen more than they admit?",
            "Who here would you choose to ask you one brutal question?",
            "Who here do you think knows your weakness best?",
            "Who here do you think you know better than they realize?",
            "If two players here were secretly jealous of each other, who would they be?",
            "If two players here would make a powerful alliance, who would they be?",
            "If someone here had a secret villain arc, who would it be?",
            "If someone here had the strongest redemption arc, who would it be?",
            "If the group had to vote out one person for being too dangerous, who would it be?",
            "If the group had to choose one person as the final boss, who would it be?"
        ];

        let usedIndexes = [];

        function openGate() {
            if (usedIndexes.length === questions.length) {
                usedIndexes = [];
            }

            let index;

            do {
                index = Math.floor(Math.random() * questions.length);
            } while (usedIndexes.includes(index));

            usedIndexes.push(index);

            document.getElementById("question").innerText = questions[index];
            document.getElementById("counter").innerText =
                "Gate opened: " + usedIndexes.length + " / " + questions.length;
        }
    </script>
</body>
</html>
